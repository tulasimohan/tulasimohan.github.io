<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Crossbones (White, thick) -->
  <g transform="translate(50, 50) rotate(45)">
    <rect x="-40" y="-8" width="80" height="16" rx="5" fill="white"/>
    <rect x="-8" y="-40" width="16" height="80" rx="5" fill="white"/>
    <circle cx="-40" cy="0" r="8" fill="white"/>
    <circle cx="40" cy="0" r="8" fill="white"/>
    <circle cx="0" cy="-40" r="8" fill="white"/>
    <circle cx="0" cy="40" r="8" fill="white"/>
  </g>
  
  <!-- Smiley Face (Yellow) -->
  <circle cx="50" cy="50" r="32" fill="#FFEB3B" stroke="black" stroke-width="2"/>
  
  <!-- Eyes -->
  <ellipse cx="40" cy="45" rx="3" ry="5" fill="black"/>
  <ellipse cx="60" cy="45" rx="3" ry="5" fill="black"/>
  
  <!-- Smile -->
  <path d="M38,62 Q50,72 62,62" stroke="black" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
