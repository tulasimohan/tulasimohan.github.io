<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 430">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="50" y1="390" x2="460" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="50" y1="390" x2="50" y2="30" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Axis labels -->
  <text x="460" y="410" font-family="serif" font-style="italic" text-anchor="end" font-size="16">x₁</text>
  <text x="35" y="35" font-family="serif" font-style="italic" text-anchor="middle" font-size="16">x₂</text>

  <!-- X ticks (1 unit = 70px) -->
  <line x1="120" y1="390" x2="120" y2="396" stroke="#333" stroke-width="1.5"/>
  <text x="120" y="412" font-family="sans-serif" text-anchor="middle" font-size="12">1</text>
  <line x1="190" y1="390" x2="190" y2="396" stroke="#333" stroke-width="1.5"/>
  <text x="190" y="412" font-family="sans-serif" text-anchor="middle" font-size="12">2</text>
  <line x1="260" y1="390" x2="260" y2="396" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="412" font-family="sans-serif" text-anchor="middle" font-size="12">3</text>
  <line x1="330" y1="390" x2="330" y2="396" stroke="#333" stroke-width="1.5"/>
  <text x="330" y="412" font-family="sans-serif" text-anchor="middle" font-size="12">4</text>

  <!-- Y ticks (1 unit = 70px) -->
  <line x1="44" y1="320" x2="50" y2="320" stroke="#333" stroke-width="1.5"/>
  <text x="38" y="324" font-family="sans-serif" text-anchor="end" font-size="12">1</text>
  <line x1="44" y1="250" x2="50" y2="250" stroke="#333" stroke-width="1.5"/>
  <text x="38" y="254" font-family="sans-serif" text-anchor="end" font-size="12">2</text>
  <line x1="44" y1="180" x2="50" y2="180" stroke="#333" stroke-width="1.5"/>
  <text x="38" y="184" font-family="sans-serif" text-anchor="end" font-size="12">3</text>
  <line x1="44" y1="110" x2="50" y2="110" stroke="#333" stroke-width="1.5"/>
  <text x="38" y="114" font-family="sans-serif" text-anchor="end" font-size="12">4</text>
  <line x1="44" y1="40" x2="50" y2="40" stroke="#333" stroke-width="1.5"/>
  <text x="38" y="44" font-family="sans-serif" text-anchor="end" font-size="12">5</text>

  <!-- Feasible region polygon: (0,0), (4,0), (3,2), (0,5) -->
  <polygon points="50,390 330,390 260,250 50,40" fill="#3498db" fill-opacity="0.18" stroke="#2980b9" stroke-width="3"/>

  <!-- Constraint: x₁ + x₂ ≤ 5 (red dashed)
       (0,5) → (50, 40)
       (5,0) → (50+350, 390) = (400, 390) -->
  <line x1="50" y1="40" x2="400" y2="390" stroke="#e74c3c" stroke-width="2" stroke-dasharray="7,4"/>

  <!-- Constraint: 2x₁ + x₂ ≤ 8 (orange dashed)
       (1.5,5) → (50+105, 40) = (155, 40)
       (4,0) → (330, 390) -->
  <line x1="155" y1="40" x2="330" y2="390" stroke="#e67e22" stroke-width="2" stroke-dasharray="7,4"/>

  <!-- Vertex points -->
  <circle cx="50" cy="390" r="5" fill="#555"/>
  <text x="44" y="405" font-family="sans-serif" font-size="12" fill="#555">(0,0)</text>

  <circle cx="330" cy="390" r="5" fill="#555"/>
  <text x="325" y="405" font-family="sans-serif" font-size="12" fill="#555">(4,0)</text>

  <circle cx="260" cy="250" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <text x="245" y="238" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c0392b">(3,2)⭑</text>

  <circle cx="50" cy="40" r="5" fill="#555"/>
  <text x="42" y="32" font-family="sans-serif" font-size="12" fill="#555">(0,5)</text>

  <!-- Constraint labels -->
  <text x="355" y="295" font-family="sans-serif" font-size="11" fill="#e74c3c">x₁ + x₂ ≤ 5</text>
  <text x="340" y="350" font-family="sans-serif" font-size="11" fill="#e67e22">2x₁ + x₂ ≤ 8</text>

  <!-- Half-plane indicators (small arrows showing direction) -->
  <!-- For x₁ + x₂ ≤ 5, the feasible side is below/left of the line -->
  <!-- For 2x₁ + x₂ ≤ 8, the feasible side is below/left of the line -->
</svg>
