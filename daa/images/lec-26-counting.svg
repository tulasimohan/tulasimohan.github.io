<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect x="0" y="0" width="600" height="300" fill="#ffffff"/>
  
  <!-- Input size n -->
  <text x="300" y="30" text-anchor="middle" font-size="15" font-family="sans-serif" fill="#333">For input length <tspan font-style="italic">n</tspan>:</text>
  
  <!-- Inputs box -->
  <rect x="40" y="45" width="230" height="100" rx="12" fill="#e8f4f8" stroke="#3498db" stroke-width="2"/>
  <text x="155" y="75" text-anchor="middle" font-size="16" font-family="sans-serif" font-weight="bold" fill="#2980b9">Possible Inputs</text>
  <text x="155" y="100" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#555">2^n binary strings</text>
  <text x="155" y="125" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#888">e.g., n = 10 → 1024 inputs</text>
  
  <!-- Decision Problems box -->
  <rect x="330" y="45" width="230" height="100" rx="12" fill="#fdedec" stroke="#e74c3c" stroke-width="2"/>
  <text x="445" y="75" text-anchor="middle" font-size="16" font-family="sans-serif" font-weight="bold" fill="#c0392b">Decision Problems</text>
  <text x="445" y="100" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#555">2^{(2^n)} distinct functions</text>
  <text x="445" y="125" text-anchor="middle" font-size="11" font-family="sans-serif" fill="#888">e.g., n = 10 → 2^{1024} problems</text>
  
  <!-- <<< symbol -->
  <text x="300" y="100" text-anchor="middle" font-size="30" font-family="sans-serif" fill="#333">≪</text>
  
  <!-- Efficient Algorithms box -->
  <rect x="150" y="170" width="300" height="80" rx="12" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="300" y="198" text-anchor="middle" font-size="16" font-family="sans-serif" font-weight="bold" fill="#d68910">Algorithms with time bound T(n)</text>
  <text x="300" y="225" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#555">Can be simulated by circuits of size ≈ T(n)²</text>
  
  <!-- Arrow from problems down to algorithms -->
  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 5 10 L 10 0 Z" fill="#e74c3c"/>
    </marker>
  </defs>
  <line x1="445" y1="145" x2="350" y2="168" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowDown)"/>
  
  <!-- Conclusion -->
  <text x="300" y="278" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#666">For any polynomial T(n), the number of problems vastly exceeds the number of efficient algorithms</text>
</svg>
