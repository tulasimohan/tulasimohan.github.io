<svg width="380" height="170" viewBox="0 0 380 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-plain" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
    <marker id="arrow-cut" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ff6f00"/>
    </marker>
  </defs>
  <!-- S side (green background) -->
  <rect x="2" y="2" width="215" height="166" rx="8" fill="#e8f5e9" fill-opacity="0.3" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="10" y="16" font-size="12" fill="#2e7d32" font-weight="bold" font-family="sans-serif">S</text>
  <!-- T side (pink background) -->
  <rect x="295" y="2" width="83" height="166" rx="8" fill="#fce4ec" fill-opacity="0.3" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="370" y="16" text-anchor="end" font-size="12" fill="#c62828" font-weight="bold" font-family="sans-serif">T</text>
  <!-- Cut line -->
  <line x1="260" y1="0" x2="260" y2="170" stroke="#ff6f00" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="260" y="-2" text-anchor="middle" font-size="11" fill="#ff6f00" font-weight="bold" font-family="sans-serif">cut</text>
  
  <!-- Nodes -->
  <circle cx="60" cy="75" r="20" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="60" y="80" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold" font-family="sans-serif">s</text>
  <circle cx="140" cy="35" r="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="140" y="40" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold" font-family="sans-serif">a</text>
  <circle cx="140" cy="115" r="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="140" y="120" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold" font-family="sans-serif">b</text>
  <circle cx="330" cy="75" r="20" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="330" y="80" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold" font-family="sans-serif">t</text>
  
  <!-- Edges within S (s→a, s→b, a→b) -->
  <line x1="78" y1="65" x2="123" y2="42" stroke="#333" stroke-width="2" marker-end="url(#arrow-plain)"/>
  <text x="95" y="48" font-size="13" fill="#333" font-family="sans-serif">5</text>
  <line x1="78" y1="85" x2="123" y2="108" stroke="#333" stroke-width="2" marker-end="url(#arrow-plain)"/>
  <text x="95" y="108" font-size="13" fill="#333" font-family="sans-serif">2</text>
  <line x1="145" y1="55" x2="145" y2="95" stroke="#333" stroke-width="2" marker-end="url(#arrow-plain)"/>
  <text x="155" y="78" font-size="13" fill="#333" font-family="sans-serif">1</text>

  <!-- Edges crossing cut (S→T) - orange -->
  <line x1="158" y1="45" x2="312" y2="68" stroke="#ff6f00" stroke-width="3" marker-end="url(#arrow-cut)"/>
  <text x="230" y="52" font-size="13" fill="#ff6f00" font-weight="bold" font-family="sans-serif">3</text>
  <line x1="158" y1="108" x2="312" y2="82" stroke="#ff6f00" stroke-width="3" marker-end="url(#arrow-cut)"/>
  <text x="230" y="104" font-size="13" fill="#ff6f00" font-weight="bold" font-family="sans-serif">2</text>

  <!-- Caption -->
  <text x="190" y="165" text-anchor="middle" font-size="10" fill="#666" font-family="sans-serif">c(S,T) = 3 + 2 = 5 = max flow (only edges S→T count)</text>
</svg>