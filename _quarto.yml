project:
  type: website
  output-dir: docs
  resources:
    - assets/**/*
    - CNAME
    - .nojekyll
    - googlef48d8f5728f4a046.html
    - sitemap.xml

bibliography: assets/bibliography/My Library.bib
csl: assets/citation-styles/apa.csl

format:
  html:
    theme: 
      light: [cosmo, assets/css/custom.scss]
    css: assets/css/custom.scss
    page-width: 100%
    margin-left: "0"
    margin-right: "0"
    include-in-header:
      text: |
        <script type="text/x-mathjax-config">
        MathJax.Hub.Config({
          TeX: {
            Macros: {
              calQ: '\\mathcal{Q}',
              calI: '\\mathcal{I}',
              calP: '\\mathcal{P}',
              calR: '\\mathcal{R}',
              calT: '\\mathcal{T}',
              calG: '\\mathcal{G}',
              R: '\\mathbb{R}',
              Adv: '\\mathrm{Adv}',
              E: ['\\mathbb{E}_{#1}\\left[#2\\right]', 2],
              pr: ['\\mathrm{Pr}_{#1}\\left[ #2\\right]', 2],
              bra: ['\\left(#1\\right)', 1],
              sbra: ['\\left[#1\\right]', 1],
              cbra: ['\\left\\{#1\\right\\}', 1],
              abra: ['\\langle#1\\rangle', 1],
              abs: ['\\left| #1 \\right|', 1],
              F: '\\mathbb{F}',
              zo: '\\{0,1\\}',
              pmone: '\\{-1,1\\}',
              CDT: '\\mathrm{CDT}',
              rhotilde: '\\tilde{\\rho}',
              depth: '\\operatorname{depth}'
            }
          }
        });
        </script>

