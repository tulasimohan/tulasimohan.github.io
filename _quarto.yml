project:
  type: website
  output-dir: docs
  resources:
    - assets/**/*
    - CNAME
    - .nojekyll
    - googlef48d8f5728f4a046.html
    
    - assets/images/**/*
    - assets/css/**/*

bibliography: assets/bibliography/My Library.bib
csl: assets/citation-styles/apa.csl

format:
  html:
    base-url: '/'
    theme:
      light: [cosmo, assets/css/custom.scss]
    css:
      - assets/css/custom.scss
    toc: true
    smooth-scroll: true
    anchor-sections: true
    page-layout: full
    font-url: /assets/fonts/
    
    linkcolor: '#198754'
    page-width: 100%
    margin-left: '0'
    margin-right: '0'
    include-in-header:
      - text: |
          <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": "Tulasimohan Molli",
            "url": "https://tulasimohan.github.io",
            "image": "https://tulasimohan.github.io/assets/images/profile_pic.jpeg",
            "jobTitle": "Postdoctoral Researcher",
            "worksFor": {
              "@type": "Organization",
              "name": "Universidad de Lisboa"
            },
            "alumniOf": [
              {
                "@type": "CollegeOrUniversity",
                "name": "Tata Institute of Fundamental Research"
              },
              {
                "@type": "CollegeOrUniversity",
                "name": "Chennai Mathematical Institute"
              }
            ],
            "email": "mailto:tulasimohanm@gmail.com",
            "sameAs": [
              "https://scholar.google.com/citations?user=YOUR_ID",
              "https://orcid.org/YOUR_ORCID",
              "https://github.com/tulasimohan"
            ]
          }
          </script>

