<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect x="0" y="0" width="600" height="300" fill="#ffffff"/>
  
  <!-- Tape cells -->
  <g stroke="#333" stroke-width="1.5">
    <rect x="30" y="40" width="60" height="50" fill="#e8f4f8"/>
    <rect x="90" y="40" width="60" height="50" fill="#e8f4f8"/>
    <rect x="150" y="40" width="60" height="50" fill="#e8f4f8"/>
    <rect x="210" y="40" width="60" height="50" fill="#d5f0e8" stroke-width="2.5"/>
    <rect x="270" y="40" width="60" height="50" fill="#e8f4f8"/>
    <rect x="330" y="40" width="60" height="50" fill="#e8f4f8"/>
    <rect x="390" y="40" width="60" height="50" fill="#e8f4f8"/>
    <rect x="450" y="40" width="60" height="50" fill="#e8f4f8"/>
    <rect x="510" y="40" width="60" height="50" fill="#e8f4f8"/>
  </g>
  
  <!-- Tape symbols -->
  <text x="60" y="72" text-anchor="middle" font-size="22" font-family="monospace" fill="#333">1</text>
  <text x="120" y="72" text-anchor="middle" font-size="22" font-family="monospace" fill="#333">0</text>
  <text x="180" y="72" text-anchor="middle" font-size="22" font-family="monospace" fill="#333">1</text>
  <text x="240" y="72" text-anchor="middle" font-size="22" font-family="monospace" fill="#333">⊔</text>
  <text x="300" y="72" text-anchor="middle" font-size="22" font-family="monospace" fill="#333">1</text>
  <text x="360" y="72" text-anchor="middle" font-size="22" font-family="monospace" fill="#333">0</text>
  <text x="420" y="72" text-anchor="middle" font-size="22" font-family="monospace" fill="#333">0</text>
  <text x="480" y="72" text-anchor="middle" font-size="22" font-family="monospace" fill="#333">1</text>
  <text x="540" y="72" text-anchor="middle" font-size="22" font-family="monospace" fill="#333">⊔</text>
  
  <!-- "..." on each end -->
  <text x="15" y="72" text-anchor="middle" font-size="18" font-family="monospace" fill="#999">⋯</text>
  <text x="585" y="72" text-anchor="middle" font-size="18" font-family="monospace" fill="#999">⋯</text>
  
  <!-- Tape label -->
  <text x="300" y="110" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#666">TAPE (memory)</text>
  
  <!-- Read/Write Head -->
  <polygon points="240,130 220,170 260,170" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <text x="240" y="195" text-anchor="middle" font-size="13" font-family="sans-serif" fill="#e74c3c">HEAD</text>
  
  <!-- Arrow from head to cell -->
  <line x1="240" y1="170" x2="240" y2="135" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  
  <!-- Finite State Control box -->
  <rect x="420" y="140" width="150" height="90" rx="10" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="495" y="170" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#f39c12">Finite State</text>
  <text x="495" y="190" text-anchor="middle" font-size="13" font-family="sans-serif" font-weight="bold" fill="#f39c12">Control</text>
  
  <!-- States inside box -->
  <circle cx="460" cy="210" r="10" fill="none" stroke="#f39c12" stroke-width="1.2"/>
  <text x="460" y="214" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#f39c12">q₀</text>
  <circle cx="495" cy="210" r="10" fill="none" stroke="#f39c12" stroke-width="1.2"/>
  <circle cx="495" cy="210" r="8" fill="none" stroke="#f39c12" stroke-width="0.8"/>
  <text x="495" y="214" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#f39c12">q₁</text>
  <circle cx="530" cy="210" r="10" fill="none" stroke="#f39c12" stroke-width="1.2"/>
  <text x="530" y="214" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#f39c12">q₂</text>
  
  <!-- Transition function label -->
  <text x="495" y="255" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#666">δ : Q × Γ → Q × Γ × {L,R}</text>
</svg>
