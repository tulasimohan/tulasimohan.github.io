  <!-- Legend -->
  <line x1="10" y1="143" x2="26" y2="143" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="30" y="147" font-size="10" fill="#333" font-family="sans-serif">forward (cf > 0)</text>
  <line x1="105" y1="143" x2="121" y2="143" stroke="#c62828" stroke-width="2" stroke-dasharray="5,3"/>
