<svg width="320" height="150" viewBox="0 0 320 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-fwd" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-bwd" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c62828"/>
    </marker>
  </defs>
  <!-- Nodes -->
  <circle cx="40" cy="75" r="20" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="40" y="80" text-anchor="middle" font-size="16" fill="#2e7d32" font-weight="bold" font-family="sans-serif">s</text>
  <circle cx="140" cy="35" r="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="140" y="40" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold" font-family="sans-serif">a</text>
  <circle cx="140" cy="115" r="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="140" y="120" text-anchor="middle" font-size="16" fill="#1565c0" font-weight="bold" font-family="sans-serif">b</text>
  <circle cx="280" cy="75" r="20" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="280" y="80" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold" font-family="sans-serif">t</text>
  <!-- Forward edges (green): cf > 0 -->
  <line x1="58" y1="65" x2="123" y2="42" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow-fwd)"/>
  <text x="80" y="48" font-size="13" fill="#2e7d32" font-family="sans-serif">2</text>
  <line x1="58" y1="85" x2="123" y2="108" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow-fwd)"/>
  <text x="80" y="108" font-size="13" fill="#2e7d32" font-family="sans-serif">2</text>
  <line x1="145" y1="55" x2="145" y2="95" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow-fwd)"/>
  <text x="155" y="78" font-size="13" fill="#2e7d32" font-family="sans-serif">1</text>
  <line x1="158" y1="105" x2="262" y2="82" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow-fwd)"/>
  <text x="200" y="104" font-size="13" fill="#2e7d32" font-family="sans-serif">2</text>
  <!-- Backward edges (red, dashed) -->
  <path d="M125,40 L100,40 L100,70 L62,70" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#arrow-bwd)" stroke-dasharray="5,3"/>
  <text x="90" y="55" font-size="13" fill="#c62828" font-family="sans-serif">3</text>
  <path d="M275,58 L260,58 L260,45 L162,45" stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#arrow-bwd)" stroke-dasharray="5,3"/>
